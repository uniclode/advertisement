<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="manifest" href='data:application/manifest+json,{"name":"Banner Ad","short_name":"Banner Ad","start_url":"https://uniclode.github.io/advertisement/","display":"standalone","background_color":"#f4f4f4","theme_color":"#ffffff","description":"A lightweight app to display a banner ad.","orientation":"portrait","icons":[{"src":"https://raw.githubusercontent.com/uniclode/advertisement/main/icon-192x192.png","sizes":"192x192","type":"image/png","purpose":"any"},{"src":"https://raw.githubusercontent.com/uniclode/advertisement/main/icon-512x512.png","sizes":"512x512","type":"image/png","purpose":"any"}]}'>
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#ffffff">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }

    .ad-container {
      width: 300px;
      height: 250px;
      position: relative;
      background: #fff; 
      outline: 1px dashed #ccc; 
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- The Banner Ad -->
  <div class="ad-container" id="adSlot">
    <script type="text/javascript">
      atOptions = {
        'key' : '4758ef35f3f687b2ced7b72372109ba9',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://bauval.org/22/4758ef35f3f687b2ced7b72372109ba9"></script>
  </div>

  <!-- Safe Ad Reload Script -->
  <script>
    setTimeout(function(){
      var adFrame = document.querySelector('#adSlot iframe');
      if (adFrame) {
        adFrame.src = adFrame.src;
      }
    }, 60000);
  </script>

  <!-- 
    FULL SERVICE WORKER 
    This dynamically creates a Service Worker to satisfy PWABuilder's 
    offline capability and reliability requirements.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'banner-ad-cache-v1';
          const urlsToCache = [
            'https://uniclode.github.io/advertisement/',
            'https://uniclode.github.io/advertisement/index.html'
          ];
          
          self.addEventListener('install', event => {
            self.skipWaiting();
            event.waitUntil(
              caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
            );
          });
          
          self.addEventListener('fetch', event => {
            event.respondWith(
              caches.match(event.request).then(response => {
                return response || fetch(event.request);
              })
            );
          });
        `;
        
        // Create the Blob and register the service worker
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl)
          .then(registration => {
            console.log('Service Worker registered successfully!');
          })
          .catch(err => {
            console.log('Service Worker registration failed: ', err);
          });
      });
    }
  </script>

</body>
</html>
