<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Ad App</title>

  <!-- Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }

    .ad-container {
      width: 300px;
      height: 250px;
      position: relative;
      background: #fff; 
      outline: 1px dashed #ccc; 
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- The Banner Ad -->
  <div class="ad-container" id="adSlot">
    <script type="text/javascript">
      atOptions = {
        'key' : '4758ef35f3f687b2ced7b72372109ba9',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script type="text/javascript" src="https://bauval.org/22/4758ef35f3f687b2ced7b72372109ba9"></script>
  </div>

  <!-- Safe Ad Reload Script -->
  <script>
    setTimeout(function(){
      var adFrame = document.querySelector('#adSlot iframe');
      if (adFrame) {
        adFrame.src = adFrame.src;
      }
    }, 60000);
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>

</body>
</html>
